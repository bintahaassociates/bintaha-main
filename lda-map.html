<!DOCTYPE html>
<html lang="ur" dir="rtl" class="scroll-smooth select-none">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ایل ڈی اے ایونیو 1 اسمارٹ نیویگیٹر | بن طاہا ایسوسی ایٹس</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Leaflet GIS Engine -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
    .gold-bg { background: linear-gradient(135deg, #d4af37 0%, #f9e8a2 45%, #e6be44 70%, #b8860b 100%); }
    .gold-border { border-color: rgba(212, 175, 55, 0.5); }
    #mapContainer { height: calc(100vh - 125px); width: 100%; background: #080d1a; cursor: crosshair; }
    .search-box-glow { box-shadow: 0 0 20px rgba(212, 175, 55, 0.35); }
    .leaflet-popup-content-wrapper { background: #0f172a; color: #fff; border: 1px solid #d4af37; border-radius: 12px; }
    .leaflet-popup-tip { background: #0f172a; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased flex flex-col h-screen overflow-hidden text-right">

  <!-- Header -->
  <header class="gold-bg text-slate-950 py-2 px-4 shadow-lg shrink-0 border-b-2 border-amber-400">
    <div class="max-w-7xl mx-auto flex items-center justify-between gap-3">
      <a href="index.html" class="flex items-center gap-2">
        <img src="logo.png" alt="Logo" class="h-9 w-9 object-contain" onerror="this.src='https://images.unsplash.com/photo-1560518883-ce09059eeffa?auto=format&fit=crop&w=100&q=80'">
        <div>
          <h1 class="text-sm sm:text-base font-black text-slate-950 leading-tight">بن طاہا ایسوسی ایٹس</h1>
          <p class="text-[10px] font-extrabold text-amber-950 uppercase tracking-wider">LDA AVENUE 1 EXCLUSIVE NAVIGATOR</p>
        </div>
      </a>

      <div class="flex items-center gap-2">
        <a href="properties.html" class="bg-slate-950 text-amber-300 px-3 py-1.5 rounded-xl text-xs font-black border border-amber-400 flex items-center gap-1 shadow">
          <i class="fa-solid fa-arrow-right"></i> <span>پراپرٹیز</span>
        </a>
        <a href="https://wa.me/923219404812" target="_blank" class="bg-emerald-600 text-white px-3 py-1.5 rounded-xl text-xs font-black flex items-center gap-1 shadow">
          <i class="fa-brands fa-whatsapp"></i> طاہا مبین بھٹہ: 0321-9404812
        </a>
      </div>
    </div>
  </header>

  <!-- Controls Bar -->
  <div class="bg-slate-900 border-b gold-border p-2.5 shrink-0 z-30">
    <div class="max-w-7xl mx-auto flex flex-col sm:flex-row items-center gap-2.5 justify-between">
      
      <!-- Smart Search -->
      <div class="flex items-center gap-2 w-full sm:w-auto">
        <select id="blockSelector" onchange="onBlockSelect()" class="bg-slate-950 border gold-border text-amber-300 text-xs px-3 py-2.5 rounded-xl outline-none font-bold">
          <option value="A" selected>Block A (رائے ونڈ روڈ / اشارہ سائیڈ)</option>
          <option value="B">Block B (خیابانِ جناح ساؤتھ)</option>
          <option value="C">Block C (سینٹرل کمرشل)</option>
          <option value="D">Block D (مین پارک ایریا)</option>
          <option value="F">Block F</option>
          <option value="G">Block G</option>
          <option value="H">Block H</option>
          <option value="J">Block J</option>
          <option value="K">Block K (ڈیفنس روڈ)</option>
          <option value="M">Block M</option>
        </select>

        <div class="relative flex-1 sm:w-72 search-box-glow rounded-xl">
          <input type="text" id="plotInput" placeholder="پلاٹ لکھیں (مثلاً 323, 243, 436)..." 
                 onkeyup="if(event.key === 'Enter') searchPlot()"
                 class="w-full bg-slate-950 border gold-border text-white text-xs pr-4 pl-16 py-2.5 rounded-xl outline-none focus:border-amber-300 text-right">
          <button onclick="searchPlot()" class="absolute left-1 top-1 bottom-1 gold-bg text-slate-950 px-3 rounded-lg text-xs font-black">
            تلاش
          </button>
        </div>
      </div>

      <!-- Quick Reset -->
      <div class="flex items-center gap-2 text-xs">
        <button onclick="resetMap()" class="gold-bg text-slate-950 px-3 py-2 rounded-xl font-black flex items-center gap-1 shadow">
          <i class="fa-solid fa-expand"></i> پورا نقشہ دیکھیں
        </button>
      </div>

    </div>
  </div>

  <!-- Map Canvas -->
  <div class="relative flex-1 w-full overflow-hidden">
    <div id="mapContainer"></div>
    <div id="coordBox" class="absolute bottom-2 left-2 z-[1000] bg-slate-900/90 border border-amber-400/60 text-amber-300 text-[11px] px-3 py-1.5 rounded-lg font-mono">
      Selected Point: y: 1621, x: 3145
    </div>
  </div>

  <script>
    // اصلی اسکیل 3513x2457
    const w = 3513;
    const h = 2457;
    const bounds = [[0, 0], [h, w]];

    const map = L.map('mapContainer', {
      crs: L.CRS.Simple,
      minZoom: -1.5,
      maxZoom: 3,
      zoomSnap: 0.2
    });

    const mapImage = L.imageOverlay('lda-map.png', bounds, { interactive: true }).addTo(map);
    map.fitBounds(bounds);

    let activeMarker = null;

    // لائیو کلک کوآرڈینیٹ ڈیٹیکٹر
    map.on('click', function(e) {
      const y = Math.round(e.latlng.lat);
      const x = Math.round(e.latlng.lng);
      document.getElementById('coordBox').innerHTML = `Selected Point: <b>y: ${y}, x: ${x}</b>`;
    });

    // لائیو اسکرین سے کیلیبریٹ شدہ ماسٹر ڈیٹا
    const verifiedBlocks = {
      'A': { y: 1660, x: 2580, name: 'ایل ڈی اے ایونیو 1 - بلاک A', desc: 'خیابانِ جناح 150 فٹ و رائے ونڈ روڈ زون' },
      'B': { y: 1440, x: 2680, name: 'ایل ڈی اے ایونیو 1 - بلاک B', desc: '150 فٹ روڈ فیسنگ ساؤتھ' },
      'C': { y: 1045, x: 2270, name: 'ایل ڈی اے ایونیو 1 - بلاک C', desc: 'مرکزی کمرشل زون' },
      'D': { y: 1565, x: 1830, name: 'ایل ڈی اے ایونیو 1 - بلاک D', desc: 'مین پارک ایریا' },
      'F': { y: 1410, x: 2000, name: 'ایل ڈی اے ایونیو 1 - بلاک F', desc: 'سیکٹر F' },
      'G': { y: 1195, x: 1290, name: 'ایل ڈی اے ایونیو 1 - بلاک G', desc: 'سیکٹر G' },
      'H': { y: 950, x: 1610, name: 'ایل ڈی اے ایونیو 1 - بلاک H', desc: 'سیکٹر H' },
      'J': { y: 705, x: 2150, name: 'ایل ڈی اے ایونیو 1 - بلاک J', desc: 'سیکٹر J' },
      'K': { y: 860, x: 2520, name: 'ایل ڈی اے ایونیو 1 - بلاک K', desc: 'ڈیفنس روڈ سیکٹر' },
      'M': { y: 660, x: 1540, name: 'ایل ڈی اے ایونیو 1 - بلاک M', desc: 'سیکٹر M' }
    };

    function resetMap() {
      map.flyToBounds(bounds, { duration: 1.2 });
      if(activeMarker) map.removeLayer(activeMarker);
    }

    function showMarker(y, x, title, subtitle, size) {
      if(activeMarker) map.removeLayer(activeMarker);

      activeMarker = L.marker([y, x]).addTo(map)
        .bindPopup(`
          <div style="text-align: center; font-family: sans-serif; padding: 6px;">
            <b style="color: #d4af37; font-size: 14px;">${title}</b><br>
            <span style="font-size: 11px; color: #cbd5e1;">${subtitle}</span><br>
            ${size ? `<span style="font-size: 12px; color: #38bdf8; font-weight: bold;">سائز: ${size}</span><br>` : ''}
            <a href="https://wa.me/923219404812?text=Assalam-o-Alaikum%20Taha%20Bhai,%20Inquiry%20regarding%20${encodeURIComponent(title)}%20LDA%20Avenue%201" 
               target="_blank" 
               style="display: inline-block; margin-top: 8px; background: #059669; color: white; padding: 5px 12px; border-radius: 8px; text-decoration: none; font-size: 11px; font-weight: bold;">
               سی ای او سے ریٹ معلوم کریں
            </a>
          </div>
        `).openPopup();

      map.flyTo([y, x], 1.8, { duration: 1.2 });
    }

    function onBlockSelect() {
      const b = document.getElementById('blockSelector').value;
      if (verifiedBlocks[b]) {
        const blk = verifiedBlocks[b];
        showMarker(blk.y, blk.x, blk.name, blk.desc, '');
      }
    }

    function searchPlot() {
      let raw = document.getElementById('plotInput').value.trim().toUpperCase();
      if(!raw) {
        onBlockSelect();
        return;
      }

      let clean = raw.replace('PLOT', '').replace('BLOCK', '').replace('SECTOR', '').trim();
      let parts = clean.split(/[- ]+/);

      let plotNum = null;
      let targetBlock = document.getElementById('blockSelector').value || 'A';

      for (let p of parts) {
        if (/^\d+$/.test(p)) {
          plotNum = parseInt(p);
        } else if (verifiedBlocks[p]) {
          targetBlock = p;
          document.getElementById('blockSelector').value = p;
        }
      }

      if(!plotNum) {
        onBlockSelect();
        return;
      }

      // بلاک A کے تصدیق شدہ زونز
      if (targetBlock === 'A') {
        // 300 تا 340 سیریز (خیابانِ جناح 150 فٹ کے بالکل اوپر پارک والی لائن، بشمول 323)
        if (plotNum >= 290 && plotNum <= 345) {
          showMarker(1615, 2580, `پلاٹ نمبر: ${plotNum}-A`, '150 فٹ روڈ و پارک فیسنگ پٹی', '10 Marla / 1 Kanal');
          return;
        }

        // 235 تا 255 سیریز (رائے ونڈ روڈ مین گیٹ کے پاس والی 1 کنال لائن، بشمول 243)
        if (plotNum >= 235 && plotNum <= 255) {
          showMarker(1720, 2740, `پلاٹ نمبر: ${plotNum}-A`, 'رائے ونڈ روڈ گیٹ کے پاس 1 کنال پٹی', '1 Kanal');
          return;
        }

        // 430 تا 470 سیریز (60 فٹ روڈ و لینڈ بریز سائیڈ، بشمول 436، 463)
        if (plotNum >= 420 && plotNum <= 480) {
          showMarker(1740, 2500, `پلاٹ نمبر: ${plotNum}-A`, '60 فٹ روڈ و لینڈ بریز سائیڈ', '10 Marla');
          return;
        }

        // 1 تا 70 سیریز (لینڈ بریز فارم کے ساتھ 1 کنال پٹی)
        if (plotNum >= 1 && plotNum <= 70) {
          showMarker(1680, 2690, `پلاٹ نمبر: ${plotNum}-A`, 'سیکٹر A پرائم پٹی', '1 Kanal');
          return;
        }

        // بلاک A ڈیفالٹ
        showMarker(1660, 2580, `پلاٹ نمبر: ${plotNum}-A`, 'ایل ڈی اے ایونیو 1 - بلاک A', '');
        return;
      }

      // بلاک B کے پلاٹس
      if (targetBlock === 'B') {
        showMarker(1440, 2680, `پلاٹ نمبر: ${plotNum}-B`, 'ایل ڈی اے ایونیو 1 - بلاک B (خیابانِ جناح ساؤتھ)', '');
        return;
      }

      // باقی بلاکس
      const blk = verifiedBlocks[targetBlock];
      showMarker(blk.y, blk.x, `پلاٹ نمبر: ${plotNum}-${targetBlock}`, blk.name, '');
    }
  </script>
</body>
</html>
