<!DOCTYPE html>
<html lang="ur" dir="rtl" class="scroll-smooth select-none">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ایل ڈی اے ایونیو 1 اسمارٹ نیویگیٹر | بن طاہا ایسوسی ایٹس</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Leaflet GIS Engine -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
    .gold-bg { background: linear-gradient(135deg, #d4af37 0%, #f9e8a2 45%, #e6be44 70%, #b8860b 100%); }
    .gold-border { border-color: rgba(212, 175, 55, 0.5); }
    #mapContainer { height: calc(100vh - 125px); width: 100%; background: #080d1a; cursor: crosshair; }
    .search-box-glow { box-shadow: 0 0 20px rgba(212, 175, 55, 0.35); }
    .leaflet-popup-content-wrapper { background: #0f172a; color: #fff; border: 1px solid #d4af37; border-radius: 12px; }
    .leaflet-popup-tip { background: #0f172a; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased flex flex-col h-screen overflow-hidden text-right">

  <!-- Header -->
  <header class="gold-bg text-slate-950 py-2 px-4 shadow-lg shrink-0 border-b-2 border-amber-400">
    <div class="max-w-7xl mx-auto flex items-center justify-between gap-3">
      <a href="index.html" class="flex items-center gap-2">
        <img src="logo.png" alt="Logo" class="h-9 w-9 object-contain" onerror="this.src='https://images.unsplash.com/photo-1560518883-ce09059eeffa?auto=format&fit=crop&w=100&q=80'">
        <div>
          <h1 class="text-sm sm:text-base font-black text-slate-950 leading-tight">بن طاہا ایسوسی ایٹس</h1>
          <p class="text-[10px] font-extrabold text-amber-950 uppercase tracking-wider">LDA AVENUE 1 EXCLUSIVE NAVIGATOR</p>
        </div>
      </a>

      <div class="flex items-center gap-2">
        <a href="properties.html" class="bg-slate-950 text-amber-300 px-3 py-1.5 rounded-xl text-xs font-black border border-amber-400 flex items-center gap-1 shadow">
          <i class="fa-solid fa-arrow-right"></i> <span>پراپرٹیز</span>
        </a>
        <a href="https://wa.me/923219404812" target="_blank" class="bg-emerald-600 text-white px-3 py-1.5 rounded-xl text-xs font-black flex items-center gap-1 shadow">
          <i class="fa-brands fa-whatsapp"></i> طاہا مبین بھٹہ: 0321-9404812
        </a>
      </div>
    </div>
  </header>

  <!-- Controls Bar -->
  <div class="bg-slate-900 border-b gold-border p-2.5 shrink-0 z-30">
    <div class="max-w-7xl mx-auto flex flex-col sm:flex-row items-center gap-2.5 justify-between">
      
      <!-- Smart Search -->
      <div class="flex items-center gap-2 w-full sm:w-auto">
        <select id="blockSelector" onchange="onBlockSelect()" class="bg-slate-950 border gold-border text-amber-300 text-xs px-3 py-2.5 rounded-xl outline-none font-bold">
          <option value="A" selected>Block A (رائے ونڈ روڈ / اشارہ سائیڈ)</option>
          <option value="B">Block B (خیابانِ جناح ساؤتھ)</option>
          <option value="C">Block C (سینٹرل کمرشل)</option>
          <option value="D">Block D (مین پارک ایریا)</option>
          <option value="F">Block F</option>
          <option value="G">Block G</option>
          <option value="H">Block H</option>
          <option value="J">Block J</option>
          <option value="K">Block K (ڈیفنس روڈ)</option>
          <option value="L">Block L</option>
          <option value="M">Block M (مین پارک M)</option>
        </select>

        <div class="relative flex-1 sm:w-72 search-box-glow rounded-xl">
          <input type="text" id="plotInput" placeholder="پلاٹ لکھیں (مثلاً 545 M یا 243 A)..." 
                 onkeyup="if(event.key === 'Enter') searchPlot()"
                 class="w-full bg-slate-950 border gold-border text-white text-xs pr-4 pl-16 py-2.5 rounded-xl outline-none focus:border-amber-300 text-right">
          <button onclick="searchPlot()" class="absolute left-1 top-1 bottom-1 gold-bg text-slate-950 px-3 rounded-lg text-xs font-black">
            تلاش
          </button>
        </div>
      </div>

      <!-- Quick Reset -->
      <div class="flex items-center gap-2 text-xs">
        <button onclick="resetMap()" class="gold-bg text-slate-950 px-3 py-2 rounded-xl font-black flex items-center gap-1 shadow">
          <i class="fa-solid fa-expand"></i> پورا نقشہ دیکھیں
        </button>
      </div>

    </div>
  </div>

  <!-- Map Canvas -->
  <div class="relative flex-1 w-full overflow-hidden">
    <div id="mapContainer"></div>
    <div id="coordBox" class="absolute bottom-2 left-2 z-[1000] bg-slate-900/90 border border-amber-400/60 text-amber-300 text-[11px] px-3 py-1.5 rounded-lg font-mono">
      Selected Point: y: 466, x: 1445
    </div>
  </div>

  <script>
    // ویب سائٹ پر موجود ہلکے نقشے کا اصل سائز
    const w = 3513;
    const h = 2457;
    const bounds = [[0, 0], [h, w]];

    const map = L.map('mapContainer', {
      crs: L.CRS.Simple,
      minZoom: -1.5,
      maxZoom: 3,
      zoomSnap: 0.2
    });

    const mapImage = L.imageOverlay('lda-map.png', bounds, { interactive: true }).addTo(map);
    map.fitBounds(bounds);

    let activeMarker = null;
    let plotsDatabase = [];

    // بڑی فائل (14400x12600) کے مقابلے میں اسکیلنگ فیکٹر
    const scaleX = 3513 / 14400;
    const scaleY = 2457 / 12600;

    // بلاکس کے مستند مراکز (Centers)
    const blockCenters = {
      'A': [1900, 2950],
      'B': [1150, 3100],
      'C': [1450, 2200],
      'D': [2050, 2250],
      'F': [1650, 1950],
      'G': [1550, 1450],
      'H': [950, 1350],
      'J': [1900, 550],
      'K': [900, 2500],
      'L': [650, 2650],
      'M': [550, 1500]
    };

    // ہر بلاک کی محفوظ باؤنڈری تاکہ دوسرے بلاک کا ایک جیسے نمبر والا پلاٹ اوورلیپ نہ ہو
    const BLOCK_LIMITS = {
      'A': { minX: 2500, maxX: 3500, minY: 1500, maxY: 2450 },
      'B': { minX: 2600, maxX: 3500, minY: 800,  maxY: 1600 },
      'C': { minX: 1700, maxX: 2600, minY: 1100, maxY: 1800 },
      'D': { minX: 1800, maxX: 2600, minY: 1700, maxY: 2400 },
      'F': { minX: 1600, maxX: 2200, minY: 1300, maxY: 2000 },
      'G': { minX: 1000, maxX: 1700, minY: 1100, maxY: 1900 },
      'H': { minX: 950,  maxX: 1650, minY: 650,  maxY: 1300 },
      'J': { minX: 150,  maxX: 950,  minY: 1400, maxY: 2350 },
      'K': { minX: 2150, maxX: 2750, minY: 550,  maxY: 1200 },
      'L': { minX: 2400, maxX: 3000, minY: 350,  maxY: 850 },
      'M': { minX: 1100, maxX: 1800, minY: 300,  maxY: 950 }
    };

    // JSON فائل لوڈ کریں
    fetch('lda_plots_data.json')
      .then(res => res.json())
      .then(data => {
        plotsDatabase = data;
        console.log("ڈیٹا لوڈ ہو گیا، کل پلاٹس:", plotsDatabase.length);
      })
      .catch(err => console.error("ڈیٹا لوڈ نہیں ہو سکا:", err));

    // لائیو کلک کوآرڈینیٹ چیکر
    map.on('click', function(e) {
      const y = Math.round(e.latlng.lat);
      const x = Math.round(e.latlng.lng);
      const coordBox = document.getElementById('coordBox');
      if (coordBox) {
        coordBox.innerHTML = `Selected Point: <b>y: ${y}, x: ${x}</b>`;
      }
    });

    // ڈراپ ڈاؤن سے بلاک سلیکٹ کرنے پر کیمرہ لے جانا
    function onBlockSelect() {
      const selectedBlock = document.getElementById('blockSelector').value;
      if (blockCenters[selectedBlock]) {
        map.setView(blockCenters[selectedBlock], 0.8);
      }
    }

    // پورا نقشہ ری سیٹ کرنا
    function resetMap() {
      map.fitBounds(bounds);
      if (activeMarker) {
        map.removeLayer(activeMarker);
        activeMarker = null;
      }
    }

    // سرچ کا حتمی فنکشن
    function searchPlot() {
      const inputEl = document.getElementById('plotInput');
      if (!inputEl) return;

      let rawVal = inputEl.value.trim().toUpperCase();
      if (!rawVal) {
        alert("براہ کرم پلاٹ نمبر اور بلاک درج کریں (مثلاً: 545 M یا 243 A)");
        return;
      }

      // بلاک اور پلاٹ نمبر الگ کرنا
      let blockMatch = rawVal.match(/[A-M]/);
      let numMatch = rawVal.match(/\d+/);

      // اگر سرچ بار میں بلاک لکھا ہے تو وہ لیں، ورنہ ڈراپ ڈاؤن والا بلاک لیں
      let targetBlock = blockMatch ? blockMatch[0] : document.getElementById('blockSelector').value;
      
      // ڈراپ ڈاؤن کو بھی خود بخود اس بلاک پر سیٹ کر دیں
      if (document.getElementById('blockSelector')) {
        document.getElementById('blockSelector').value = targetBlock;
      }

      if (!numMatch) {
        alert("براہ کرم پلاٹ کا درست نمبر لکھیں");
        return;
      }
      let plotNum = numMatch[0];

      let limits = BLOCK_LIMITS[targetBlock];

      // تمام میچنگ پلاٹس تلاش کریں
      let candidates = plotsDatabase.filter(item => item.plot === plotNum);

      let found = null;
      if (candidates.length > 0) {
        if (limits) {
          // صرف وہی پلاٹ منتخب کریں جو مطلوبہ بلاک کی حدود کے اندر واقع ہو
          found = candidates.find(item => {
            let adjX = Math.round(item.x * scaleX);
            let adjY = Math.round(item.y * scaleY);
            return adjX >= limits.minX && adjX <= limits.maxX && adjY >= limits.minY && adjY <= limits.maxY;
          });
        }
        // اگر حدود میں نہ ملے تو قریب ترین پہلا امیدوار لیں
        if (!found) found = candidates[0];
      }

      if (found) {
        if (activeMarker) {
          map.removeLayer(activeMarker);
        }

        const adjustedY = Math.round(found.y * scaleY);
        const adjustedX = Math.round(found.x * scaleX);

        // سیدھا پلاٹ پر زوم کریں اور مارکر لگائیں
        map.setView([adjustedY, adjustedX], 2);

        activeMarker = L.marker([adjustedY, adjustedX]).addTo(map);
        activeMarker.bindPopup(`
          <div style="direction:rtl; text-align:center; font-family:sans-serif; min-width:150px; padding:4px;">
            <b style="font-size:16px; color:#d4af37;">پلاٹ نمبر: ${plotNum} (بلاک ${targetBlock})</b><br>
            <span style="font-size:12px; color:#cbd5e1;">ایل ڈی اے ایونیو 1</span><br><br>
            <a href="https://wa.me/923219404812?text=مجھے ایل ڈی اے ایونیو 1 کے پلاٹ نمبر ${plotNum}-${targetBlock} کے ریٹ اور معلومات درکار ہیں" 
               target="_blank" 
               style="background:#25D366; color:white; padding:6px 14px; text-decoration:none; border-radius:6px; display:inline-block; font-size:12px; font-weight:bold;">
               واٹس ایپ پر رابطہ کریں
            </a>
          </div>
        `).openPopup();
      } else {
        alert(`معذرت! بلاک ${targetBlock} میں پلاٹ نمبر ${plotNum} نہیں مل سکا۔ براہ کرم نمبر چیک کر کے دوبارہ کوشش کریں۔`);
      }
    }
  </script>
</body>
</html>
