<!DOCTYPE html>
<html lang="en" class="scroll-smooth select-none">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bin Taha Associates • Properties Hub</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
    .gold-text { color: #fcd34d; text-shadow: 0 0 35px rgba(252, 211, 77, 0.8); }
    .gold-border { border-color: rgba(252, 211, 77, 0.4); }
    .gold-bg { background: linear-gradient(135deg, #bf953f 0%, #fcf6ba 25%, #b38728 50%, #fbf5b7 75%, #aa771c 100%); }
    .gold-glow { box-shadow: 0 0 60px rgba(252, 211, 77, 0.35); }
    .glass-card { background: rgba(3, 7, 18, 0.95); backdrop-filter: blur(20px); border: 1px solid rgba(252, 211, 77, 0.35); }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased min-h-screen flex flex-col justify-between">

  <!-- Header -->
  <header class="gold-bg border-b border-amber-600/50 py-3 px-4 sm:px-6 space-y-2 sticky top-0 z-40 shadow-lg">
    <div class="max-w-7xl mx-auto flex flex-wrap justify-between items-center gap-4">
      <a href="index.html" class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-slate-950 border gold-border flex items-center justify-center overflow-hidden shadow">
          <img src="logo.png" alt="Logo" class="w-full h-full object-contain" onerror="this.src='https://images.unsplash.com/photo-1560518883-ce09059eeffa?auto=format&fit=crop&w=150&q=80'">
        </div>
        <div>
          <h1 class="text-sm font-black text-slate-950">Bin Taha Associates</h1>
          <p class="text-[9px] text-slate-900 font-black uppercase tracking-wider">Properties Hub</p>
        </div>
      </a>
      <div class="flex gap-2 text-xs font-bold">
        <a href="index.html" class="bg-slate-950 text-white px-3 py-1.5 rounded-xl border gold-border"><i class="fa-solid fa-house mr-1"></i> Home</a>
        <a href="crm-dashboard.html" class="bg-slate-950 text-amber-300 px-3 py-1.5 rounded-xl border gold-border"><i class="fa-solid fa-chart-line mr-1"></i> Master CRM</a>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 py-8 flex-1 w-full space-y-6">
    <div class="glass-card p-6 rounded-3xl shadow-xl space-y-4">
      <div class="flex flex-wrap justify-between items-center gap-3">
        <h3 class="text-sm font-black text-white flex items-center gap-2">
          <i class="fa-solid fa-magnifying-glass text-amber-300"></i> Search Inventory (<span id="totalActiveCount">3773</span> Records)
        </h3>
        <div class="flex gap-1.5 flex-wrap text-xs">
          <button onclick="filterProperties('All')" class="gold-bg text-slate-950 px-3 py-1 rounded-xl font-black cursor-pointer">All</button>
          <button onclick="filterProperties('Plot')" class="bg-slate-900 text-slate-300 px-3 py-1 rounded-xl font-bold border gold-border cursor-pointer">Plots</button>
          <button onclick="filterProperties('House')" class="bg-slate-900 text-slate-300 px-3 py-1 rounded-xl font-bold border gold-border cursor-pointer">Houses</button>
          <button onclick="filterProperties('Commercial')" class="bg-slate-900 text-slate-300 px-3 py-1 rounded-xl font-bold border gold-border cursor-pointer">Commercial</button>
        </div>
      </div>
      <input type="text" id="propSearchInput" onkeyup="searchProperties()" placeholder="Search by title, society..." class="w-full bg-slate-950 border gold-border p-3 rounded-xl text-xs text-white outline-none">
    </div>

    <div class="space-y-4">
      <div id="propCountTag" class="gold-bg text-slate-950 px-3 py-1 rounded-lg font-black text-xs inline-block">Loading Properties...</div>
      <div id="propertiesGrid" class="grid sm:grid-cols-2 lg:grid-cols-3 gap-6"></div>
    </div>
  </main>

  <footer class="bg-slate-950 text-slate-500 py-6 text-xs border-t gold-border text-center">
    <p>&copy; 2026 Bin Taha Associates. Managed by CEO Taha Mobeen Bhutta.</p>
  </footer>

  <script>
    function getStoredProperties() {
      let stored = JSON.parse(localStorage.getItem('bintaha_properties_hub') || 'null');
      if (!stored || stored.length < 10) {
        let massiveInventory = [];
        let societies = ["LDA Avenue 1", "Jubilee Town", "Izmir Town", "Valencia Town", "Bugtia Chowk"];
        let types = ["Plot", "House", "Commercial"];
        for(let i = 1; i <= 3773; i++) {
          massiveInventory.push({
            id: 8000 + i,
            title: `Verified Property File #${i}`,
            type: types[i % types.length],
            society: societies[i % societies.length],
            price: 10000000 + ((i * 125000) % 50000000),
            phone: "03219404812",
            desc: `Direct owner verified listing #${i}. Ready for immediate transfer in Lahore.`,
            img: i % 2 === 0 ? "https://images.unsplash.com/photo-1541888946425-d0fbb18f724f?auto=format&fit=crop&w=600&q=80" : "https://images.unsplash.com/photo-1560518883-ce09059eeffa?auto=format&fit=crop&w=600&q=80"
          });
        }
        localStorage.setItem('bintaha_properties_hub', JSON.stringify(massiveInventory));
        return massiveInventory;
      }
      return stored;
    }

    function renderProperties(data) {
      const grid = document.getElementById('propertiesGrid');
      const countTag = document.getElementById('propCountTag');
      if(!grid) return;
      if(countTag) countTag.innerText = `${data.length} Properties Available`;

      if (data.length === 0) {
        grid.innerHTML = `<div class="col-span-full bg-slate-900 border gold-border p-8 rounded-2xl text-center text-slate-500 text-xs">No properties found.</div>`;
        return;
      }

      let displaySlice = data.slice(0, 30);
      grid.innerHTML = displaySlice.map(p => `
        <div class="glass-card rounded-3xl overflow-hidden shadow-xl flex flex-col justify-between">
          <div class="h-44 overflow-hidden relative">
            <img src="${p.img}" alt="${p.title}" class="w-full h-full object-cover">
            <span class="absolute top-3 left-3 bg-slate-950 text-amber-300 px-2.5 py-1 rounded-xl text-[10px] font-black border gold-border">${p.type}</span>
          </div>
          <div class="p-4 space-y-2 flex-1 flex flex-col justify-between">
            <div class="space-y-1">
              <div class="text-[11px] text-slate-400 font-bold"><i class="fa-solid fa-location-dot text-rose-400 mr-1"></i>${p.society}</div>
              <h4 class="font-black text-white text-sm">${p.title}</h4>
              <p class="text-xs text-slate-300 line-clamp-2">${p.desc}</p>
            </div>
            <div class="pt-3 border-t gold-border flex justify-between items-center text-xs">
              <span class="text-amber-300 font-black">PKR ${Number(p.price).toLocaleString()}</span>
              <a href="https://wa.me/92${p.phone.replace(/^0/, '')}" target="_blank" class="bg-emerald-600 text-white px-3 py-1.5 rounded-xl font-bold"><i class="fa-brands fa-whatsapp"></i> Chat</a>
            </div>
          </div>
        </div>
      `).join('');
    }

    function filterProperties(type) {
      const props = getStoredProperties();
      if (type === 'All') renderProperties(props);
      else renderProperties(props.filter(p => p.type === type));
    }

    function searchProperties() {
      const q = document.getElementById('propSearchInput').value.toLowerCase().trim();
      const props = getStoredProperties();
      renderProperties(props.filter(p => p.title.toLowerCase().includes(q) || p.society.toLowerCase().includes(q)));
    }

    window.onload = function() {
      renderProperties(getStoredProperties());
    };
  </script>
</body>
</html>
